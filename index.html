<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="Block Blast - The ultimate block puzzle challenge. Drag and drop colorful blocks to clear lines and score big!">
    <title>Block Blast</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Main Menu Screen -->
    <div id="main-menu" class="screen active" style="display: flex;">
        <h1 class="neon-title">Block Blast</h1>
        <p class="subtitle">The ultimate block puzzle challenge</p>
        <button id="play-button" class="neon-button">PLAY</button>
    </div>

    <!-- Game Screen -->
    <div id="game-screen" class="screen" style="display: none;">
        <div class="game-header">
            <div class="header-left">
                <div class="best-score-container">
                    <span class="crown-icon">👑</span>
                    <span id="high-score">0</span>
                </div>
            </div>
            <div class="header-center">
                <span id="score">0</span>
                <div id="floating-text-container"></div>
            </div>
            <div class="header-right">
                <button id="back-button" class="settings-button">⚙️</button>
            </div>
        </div>
        
        <div class="canvas-wrapper">
            <canvas id="gameCanvas" width="400" height="600"></canvas>
            <div id="grid-overlay"></div>
            <div id="combo-display"></div>
        </div>
    </div>

    <!-- Settings Modal -->
    <div id="settings-modal" class="modal-overlay" style="display: none;">
        <div class="settings-card">
            <div class="settings-header">
                <h2>Settings</h2>
                <button id="settings-close" class="close-button">X</button>
            </div>
            
            <div class="settings-top-row">
                <button id="toggle-sound" class="icon-button active">
                    <span class="icon">🔊</span>
                    <span>Sound</span>
                </button>
                <button id="toggle-bgm" class="icon-button">
                    <span class="icon">🎵</span>
                    <span>BGM</span>
                </button>
                <button id="toggle-vibe" class="icon-button active">
                    <span class="icon">📳</span>
                    <span>Vibration</span>
                </button>
            </div>
            
            <div class="settings-list">
                <button class="list-button">More Games</button>
                <button class="list-button">More Settings</button>
                <button id="settings-home" class="list-button highlight-green">🏠 Home</button>
                <button id="settings-replay" class="list-button highlight-green">🔄 Replay</button>
            </div>
            
            <button id="theme-switcher-btn" class="theme-button">👕 Default Skin</button>
        </div>
    </div>

    <!-- Game Over Modal -->
    <div id="game-over-modal" class="modal-overlay game-over-theme" style="display: none;">
        <div class="game-over-card">
            <h2 class="game-over-title">Game Over</h2>
            <div class="game-over-scores">
                <div class="score-group">
                    <span class="score-label">Score</span>
                    <span id="final-score" class="score-value">0</span>
                </div>
                <div class="score-group">
                    <span class="score-label best-label">Best Score</span>
                    <span id="modal-best-score" class="score-value best-value">0</span>
                </div>
            </div>
            <button id="restart-button" class="play-again-btn">
                <span class="play-icon">▶</span>
            </button>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
